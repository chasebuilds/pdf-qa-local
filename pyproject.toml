[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-qa-local"
version = "0.1.0"
description = "Private question answering over a folder of PDFs using a local Ollama model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pypdf>=4", "numpy>=1.26", "httpx>=0.27"]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "reportlab>=4"]

[project.scripts]
pdfqa = "pdfqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "bench"]

[[tool.mypy.overrides]]
module = ["streamlit", "reportlab.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
